<div class="flex w-full flex-col gap-6 p-6">
  <lib-recruitment-batch-header
    [activeTab]="activeTab()"
    (addDirect)="onAddDirect()"
    (addFromProposal)="onAddFromProposal()"
    (addProposal)="onAddProposal()"
  />

  <div class="flex gap-4 border-b border-surface-200 pb-2">
    <button
      (click)="onTabChange('proposal')"
      [class]="activeTab() === 'proposal'
        ? 'text-primary font-medium border-b-2 border-primary pb-1'
        : 'text-surface-600 hover:text-surface-900'"
    >
      Đề xuất tuyển dụng
    </button>
    <button
      (click)="onTabChange('batch')"
      [class]="activeTab() === 'batch'
        ? 'text-primary font-medium border-b-2 border-primary pb-1'
        : 'text-surface-600 hover:text-surface-900'"
    >
      Đợt tuyển dụng
    </button>
  </div>

  <div class="relative overflow-hidden">
    @if (activeTab() === 'proposal') {
      <app-recruitment-batch-table
        [data]="proposalBatches()"
        [columns]="columns"
        [loading]="loading()"
        [selectable]="true"
        [(selectedData)]="selectedData"
        (selectionChange)="onSelectionChange($event)"
      />
    }

    @if (activeTab() === 'batch') {
      <app-recruitment-batch-table
        [data]="recruitmentBatches()"
        [columns]="columns"
        [loading]="loading()"
        [selectable]="true"
        [(selectedData)]="selectedData"
        (selectionChange)="onSelectionChange($event)"
        (rowDoubleClick)="onBatchDoubleClick($event)"
      />
    }
  </div>

  @if (showDetailCanvas()) {
    <lib-canvas
      [opened]="showDetailCanvas()"
      [title]="'Chi tiết đợt tuyển dụng'"
      [width]="'600px'"
      (closed)="onCloseDetailCanvas()"
    >
    <lib-recruitment-batch-detail [data]="selectedBatch()" />
  </lib-canvas>
  }
</div>
