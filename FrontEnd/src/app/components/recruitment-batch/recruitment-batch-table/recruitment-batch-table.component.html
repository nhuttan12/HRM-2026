@if (loading()) {
  <div class="w-full">
    @for (row of [1, 2, 3, 4, 5]; track row) {
      <div class="flex min-h-14 items-center gap-4 border-b border-gray-200 p-4">
        @for (column of columns(); track column.field) {
          <lib-skeleton class="shrink-0" [width]="column.width ?? '150px'" height="20px" />
        }
      </div>
    }
  </div>
} @else {
  <ng-template #statusCell let-row>
    <lib-label [text]="row.status" [variant]="statusVariant(row.status)" />
  </ng-template>
  <lib-hrm-table
    [data]="data()"
    [columns]="columns()"
    [cellTemplates]="{ status: statusCell }"
    [selectable]="selectable()"
    [maxHeight]="maxHeight()"
    [(selectedData)]="selectedData"
    (selectionChange)="onSelectionChange($event)"
    (rowDoubleClick)="onRowDoubleClick($event)"
  />
}
