<div class="flex min-h-full w-full flex-col gap-6 p-6">
  <!-- Header -->
  <app-candidate-profile-header
    (searchAction)="onSearch($event)"
    (addAction)="onAdd()"
  />

  <!-- Table -->
  <app-candidate-profile-table
    (candidateClick)="onCandidateClick($event)"
  />
</div>

<lib-canvas
  #candidateCanvas
  title="Chi tiết ứng viên"
  width="720px"
  (closed)="onCanvasClosed()"
>
  <app-candidate-profile-detail
    [candidateCode]="selectedCandidateCode()"
  />
</lib-canvas>
