<div
  class="candidate-profile-header flex flex-col gap-4 md:flex-row md:items-center md:justify-between"
>
  <!-- Tiêu đề -->
  <div>
    <h2 class="text-xl font-semibold text-surface-900">
      Hồ sơ ứng viên
    </h2>

    <p class="mt-1 text-sm text-surface-500">
      Quản lý và tìm kiếm hồ sơ ứng viên
    </p>
  </div>

  <!-- Thao tác -->
  <div class="flex flex-col gap-2 sm:flex-row sm:items-center">
    <!-- Tìm kiếm -->
    <lib-search-button
      [keyword]="searchKeyword()"
      (keywordChange)="searchKeyword.set($event)"
      placeholder="Tìm kiếm ứng viên..."
      (searchAction)="onSearch()"
    />

    <!-- Thêm ứng viên -->
    <lib-add-button
      (addAction)="onAdd()"
    />
  </div>
</div>
