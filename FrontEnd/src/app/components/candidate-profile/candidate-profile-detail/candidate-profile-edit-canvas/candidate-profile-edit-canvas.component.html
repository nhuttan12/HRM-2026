<lib-canvas
  [title]="title"
  width="1000px"
  (closed)="onCanvasClosed()"
>
  @if (section(); as currentSection) {
    @if (row(); as currentRow) {
      <div class="space-y-6">
        <div>
          <lib-text
            tag="h2"
            [text]="title"
            className="text-xl font-semibold"
          />
          <p class="mt-1 text-sm text-gray-500">
            Cập nhật thông tin và bấm Lưu để xác nhận.
          </p>
        </div>

        <div class="grid grid-cols-1 gap-5 md:grid-cols-2">
          @for (field of fieldConfigs[currentSection]; track field.key) {
            <lib-input
              [label]="field.label"
              [value]="formatFieldValue(currentRow[field.key])"
              [isView]="false"
              [required]="field.required ?? false"
              (valueChange)="onFieldChange(field.key, $event)"
            />
          }
        </div>

        <div class="flex justify-end border-t border-gray-200 pt-5">
          <lib-save-button (saveAction)="onSave()" />
        </div>
      </div>
    }
  }
</lib-canvas>
