<lib-canvas [opened]="opened()" title="Thêm ứng viên vào đợt tuyển dụng" width="min(1100px, 100%)" (closed)="close()">
  <div class="flex flex-col gap-5">
    <div class="flex flex-wrap items-end justify-between gap-4">
      <div>
        <lib-text tag="h2" text="Danh sách ứng viên" className="text-xl font-semibold text-surface-900" />
        <lib-text tag="p" text="Chọn ứng viên để thêm vào vòng đầu tiên." className="mt-1 text-sm text-surface-500" />
      </div>
      <lib-save-button label="Thêm ứng viên" icon="pi pi-plus" [disabled]="selected().length === 0" (saveAction)="addSelected()" />
    </div>
    <lib-input label="Tìm kiếm ứng viên" placeholder="Tên, mã, email, số điện thoại hoặc vị trí" [value]="keyword()" (valueChange)="keyword.set($event)" />
    <lib-text tag="p" [text]="'Đã chọn: ' + selected().length" className="text-sm text-surface-600" />
    <lib-hrm-table [data]="candidates()" [columns]="columns" [selectable]="true" [selectedData]="selected()" (selectedDataChange)="selected.set($event)" />
  </div>
</lib-canvas>
