<div class="flex h-full min-h-0 flex-col overflow-hidden md:flex-row">
  <app-recruitment-tracking-candidate-detail-sidebar
    class="w-full shrink-0 md:w-72 md:overflow-y-auto"
    [candidate]="candidate()"
    [batch]="batch()"
    [activeSection]="activeSection()"
    (sectionChange)="activeSection.set($event)"
  />
  <app-recruitment-tracking-candidate-detail-content
    class="flex min-h-0 min-w-0 flex-1 flex-col"
    [candidate]="candidate()"
    [batch]="batch()"
    [rounds]="rounds()"
    [activeSection]="activeSection()"
    (roundsChange)="roundsChange.emit($event)"
  />
</div>
