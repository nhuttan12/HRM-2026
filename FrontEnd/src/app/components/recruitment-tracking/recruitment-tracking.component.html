<div class="flex h-dvh min-h-[32rem] flex-col gap-6 p-6">
  @if (selectedBatch(); as batch) {
    <header class="flex flex-wrap items-start justify-between gap-4">
      <div>
        <button
          type="button"
          class="mb-3 text-sm font-medium text-blue-700 hover:underline"
          (click)="closeBatch()"
        >
          <i class="pi pi-arrow-left mr-1" aria-hidden="true"></i> Danh sách đợt tuyển dụng
        </button>
        <lib-text
          tag="p"
          [text]="batch.code + ' · ' + batch.position"
          className="mt-1 text-sm text-surface-500"
        />
      </div>
      <lib-text
        tag="span"
        [text]="batch.status"
        className="rounded-full bg-green-100 px-3 py-1 text-xs font-medium text-green-700"
      />
    </header>
    <app-recruitment-tracking-kanban
      class="block min-h-0 flex-1"
      [loading]="kanbanLoading()"
      [stages]="stages()"
      (stagesChange)="updateBoard($event)"
      (addCandidate)="addCandidateOpened.set(true)"
      (candidateDetail)="openCandidateDetail($event)"
    />
    <lib-canvas
      [opened]="detailOpened()"
      title="Chi tiết ứng viên trong đợt tuyển dụng"
      width="100%"
      (closed)="detailOpened.set(false)"
    >
      @if (detailCandidate(); as candidate) {
        <app-recruitment-tracking-candidate-detail
          [candidate]="candidate"
          [batch]="batch"
          [rounds]="selectedRounds()"
          (roundsChange)="updateRounds($event)"
        />
      }
    </lib-canvas>
    <app-recruitment-tracking-add-candidate
      [opened]="addCandidateOpened()"
      [excludedIds]="assignedCandidateIds()"
      (added)="addCandidates($event)"
      (closed)="addCandidateOpened.set(false)"
    />
  } @else {
    <header>
      <lib-text
        tag="h1"
        text="Theo dõi tuyển dụng"
        className="text-xl font-semibold text-surface-900"
      />
      <lib-text
        tag="p"
        text="Nhấp đúp vào đợt đang mở để theo dõi ứng viên."
        className="mt-1 text-sm text-surface-500"
      />
    </header>
    @if (listLoading()) {
      <div
        class="overflow-x-auto rounded-xl border border-surface-200"
        role="status"
        aria-label="Đang tải danh sách đợt tuyển dụng"
      >
        @for (row of [1, 2, 3, 4, 5, 6]; track row) {
          <div
            class="flex min-w-[1100px] items-center gap-4 border-b border-surface-200 p-4 last:border-b-0"
          >
            @for (column of columns; track column.field) {
              <lib-skeleton class="shrink-0" [width]="column.width ?? '150px'" height="20px" />
            }
          </div>
        }
      </div>
    } @else {
      <lib-hrm-table [data]="batches" [columns]="columns" (rowDoubleClick)="openBatch($event)" />
    }
  }
</div>
