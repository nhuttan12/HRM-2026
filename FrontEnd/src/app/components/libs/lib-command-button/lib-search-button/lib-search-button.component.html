
<div class="w-full rounded-lg border border-gray-300 bg-white p-1">
  <div class="flex w-full items-center gap-2">
    <lib-input
      class="min-w-0 flex-1"
      [value]="keyword()"
      [placeholder]="placeholder()"
      (valueChange)="keywordChange.emit($event)"
    />

    <lib-command-button
      label="Tìm kiếm"
      icon="pi pi-search"
      severity="info"
      (clicked)="onSearch()"
    />
  </div>
</div>
