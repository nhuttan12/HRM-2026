<p-select
  [formControl]="formControl()"
  [options]="menuItems()"
  optionLabel="label"
  optionValue="id"
  [disabled]="disabled()"
  [placeholder]="placeholder()"
  (onChange)="onSelectChange($event)"
  styleClass="
    min-w-[120px] items-center justify-center rounded-[10px] border-0 shadow-none
    hover:!border-0 hover:!shadow-none
    active:!border-0 active:!shadow-none
    focus-visible:!border-0
  "
/>
