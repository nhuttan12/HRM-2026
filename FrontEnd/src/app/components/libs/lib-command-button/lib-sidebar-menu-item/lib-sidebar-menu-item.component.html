<button
  type="button"
  class="flex min-h-[42px] w-full items-center gap-3 rounded-lg border-0 px-3 py-2 text-left text-[13px] transition-colors"
  [class.bg-blue-50]="active()"
  [class.text-blue-700]="active()"
  [class.font-semibold]="active()"
  [class.text-gray-600]="!active()"
  [class.hover:bg-gray-100]="!active()"
  (click)="onClick()"
>
  @if (icon()) {
    <i [class]="icon() + ' w-[18px]'"></i>
  }
  <lib-text tag="span" [text]="label()" />
</button>
