
<p-button
  [label]="label()"
  [icon]="icon()"
  [severity]="severity()"
  [size]="size()"
  [disabled]="disabled()"
  [loading]="loading()"
  styleClass="
    inline-flex min-w-[120px] min-h-[40px] items-center justify-center
    rounded-[10px] px-4 py-2.5 text-sm font-semibold leading-5
    transition-[transform,box-shadow,background-color,border-color]
    duration-150 ease-in-out
    hover:-translate-y-px
    active:translate-y-0
    focus-visible:outline-none
    focus-visible:shadow-[0_0_0_3px_rgb(59_130_246_/_20%)]
    disabled:cursor-not-allowed disabled:opacity-[0.55]
    [&_.p-button-icon]:text-inherit
    [&_.p-button-label]:font-semibold
    [&.p-button-sm]:min-w-[80px]
    [&.p-button-sm]:min-h-8
    [&.p-button-sm]:rounded-[10px]
    [&.p-button-sm]:px-3
    [&.p-button-sm]:py-1.5
    [&.p-button-sm]:text-xs
    [&.p-button-lg]:min-w-[140px]
    [&.p-button-lg]:min-h-12
    [&.p-button-lg]:px-5
    [&.p-button-lg]:py-3
    [&.p-button-lg]:text-base
    [&.p-button-icon-only]:min-w-[40px]
    [&.p-button-icon-only]:px-0
  "
  (onClick)="onClick()"
/>
