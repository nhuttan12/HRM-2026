<aside
  class="relative z-20 flex h-screen w-[260px] shrink-0 flex-col
         overflow-hidden
         border-r border-surface-200
         bg-surface-0
         shadow-lg"
>
  <!-- Logo -->
  <div
    class="flex h-16 shrink-0 items-center
           border-b border-surface-200
           px-5"
  >
    <div class="flex items-center gap-3">
      <div
        class="flex h-10 w-10 shrink-0 items-center justify-center
          rounded-xl
        bg-white
          text-surface-900
          shadow-md
          transition-all duration-200
          hover:scale-105 hover:shadow-lg"
      >
        <i class="pi pi-users text-3xl"></i>
      </div>

      <div>
        <h1 class="text-lg font-bold leading-tight text-surface-900">
          HRM
        </h1>

        <p class="text-xs text-surface-500">
          Quản lý nhân sự
        </p>
      </div>
    </div>
  </div>

  <!-- Menu -->
  <nav class="min-h-0 flex-1 overflow-y-auto px-3 py-5">
    <p
      class="mb-3 px-3 text-[11px] font-bold uppercase
             tracking-widest text-surface-400"
    >
      Tuyển dụng
    </p>

    <p-panelmenu
      [model]="menuItems"
      styleClass="hrm-sidebar-menu"
    />
  </nav>

  <!-- User -->
  <div class="shrink-0 border-t border-surface-200 p-3">
    <div
      class="group flex cursor-pointer items-center gap-3
             rounded-xl border border-transparent
             p-2.5
             transition-all duration-200
             hover:border-surface-200
             hover:bg-surface-50
             hover:shadow-sm"
    >
      <!-- Avatar -->
      <img
        src="https://file.hstatic.net/200000503583/file/chup-anh-chan-dung__1__e1859e166f6a4a978394f272e0df0d53.jpg"
        alt="Admin User"
        class="h-10 w-10 shrink-0 rounded-full
               object-cover
               ring-2 ring-surface-100
               transition-all duration-200
               group-hover:scale-105
               group-hover:ring-primary/30"
      />

      <!-- Info -->
      <div class="min-w-0 flex-1">
        <p class="truncate text-sm font-semibold text-surface-900">
          Admin User
        </p>

        <p class="truncate text-xs text-surface-500">
          Administrator
        </p>
      </div>

      <!-- More -->
      <button
        type="button"
        class="flex h-8 w-8 shrink-0 items-center justify-center
               rounded-lg
               text-surface-400
               transition-all duration-200
               hover:bg-surface-200
               hover:text-surface-700
               group-hover:scale-105"
      >
        <i class="pi pi-ellipsis-v text-sm"></i>
      </button>
    </div>
  </div>
</aside>
