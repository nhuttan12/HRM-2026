<div class="relative inline-block" (click)="$event.stopPropagation()" (keydown.enter)="toggle()" tabindex="0" role="button">
  <button
    type="button"
    class="
      inline-flex items-center justify-center gap-2
      min-w-[80px] min-h-[35px]
      rounded-[10px] border-0 shadow-none
      text-xs font-semibold
      transition-colors duration-150
      hover:shadow-sm
      active:scale-95
      focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-offset-2
    "
    [class]="
      disabled()
        ? 'bg-gray-100 text-gray-400 cursor-not-allowed'
        : label() === '' || severity() === 'success'
          ? 'bg-green-600 text-white hover:bg-green-700'
          : 'bg-gray-800 text-white hover:bg-gray-700'
    "
    [disabled]="disabled()"
    (click)="toggle()"
    (keydown.enter)="toggle()"
    aria-label="Mở danh sách thao tác"
  >
    <span>{{ label() }}</span>
    <svg
      class="w-4 h-4 shrink-0"
      xmlns="http://www.w3.org/2000/svg"
      fill="none"
      viewBox="0 0 24 24"
      stroke="currentColor"
    >
      <path
        stroke-linecap="round"
        stroke-linejoin="round"
        stroke-width="2"
        d="M19 9l-7 7-7-7"
      />
    </svg>
  </button>

  @if (isOpen) {
    <div
      class="
        absolute z-[1000] mt-2 w-48 right-0
        bg-white border border-gray-200 rounded-xl shadow-lg
        py-2
        animate-in fade-in slide-in-from-top-2 duration-150
      "
      (click)="$event.stopPropagation()" (keydown.enter)="$event.stopPropagation()" tabindex="0" role="menu"
    >
      @for (item of menuItems(); track item.label) {
        <button
          type="button"
          class="
            flex items-center gap-3 w-full px-4 py-2.5 text-xs
            text-left text-gray-700
            hover:bg-gray-50 hover:text-gray-900
            transition-colors duration-100
            disabled:opacity-50 disabled:cursor-not-allowed
            select-none
          "
          [disabled]="disabled() || item.disabled"
          (click)="onItemClick(item)"
          (keydown.enter)="onItemClick(item)"
        >
          @if (item.icon) {
            <i [class]="item.icon + ' w-4 h-4 shrink-0 text-gray-500'"></i>
          }
          <span>{{ item.label }}</span>
        </button>
      }
    </div>
  }
</div>
