<div
  class="block bg-gray-200"
  [class.animate-pulse]="animated()"
  [class.rounded-sm]="variant() === 'text'"
  [class.rounded-lg]="variant() === 'rect'"
  [class.rounded-full]="variant() === 'circle'"
  [class]="customClass()"
  [style.width]="variant() === 'circle' ? height() : width()"
  [style.height]="height()"
  [style.border-radius]="borderRadius()"
></div>
