<div class="lib-input">
  @if (label()) {
    <label class="lib-input__label" [for]="inputId()">
        {{ label() }}
        @if (required()) {
        <span aria-hidden="true">*</span>
        }
    </label>
  }

  <input
    pInputText
    class="w-full"
    [type]="type()"
    [value]="value()"
    [placeholder]="placeholder()"
    [disabled]="disabled()"
    [required]="required()"
    (input)="valueChange.emit($any($event.target).value)"
  />
</div>
